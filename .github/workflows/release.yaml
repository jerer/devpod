name: Publish release
on:
  push:
    tags:
      - '*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      package_version: ${{ steps.get-version.outputs.package_version }}
      original_package_version: ${{ steps.get-version.outputs.original_package_version }}
      release_id: ${{ steps.get-release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 16

      - run: npm install semver

      - name: Get Version
        uses: actions/github-script@v9
        id: get-version
        with:
          script: |
            const semver = require("semver")
            const refName = `${process.env.GITHUB_REF_NAME}`
            // Strip leading "v" if present, otherwise use the tag as-is
            let version = refName.startsWith("v") ? refName.slice(1) : refName

            core.info(`Original Version: ${version}`)
            core.setOutput("original_package_version", version)

            // Apply semver prerelease normalization only for semver-formatted tags
            const parsed = semver.parse(version);
            if (parsed) {
              const supportedPreleases = [
                { tag: "alpha", number: 1 },
                { tag: "beta", number: 2 },
                { tag: "rc", number: 3 },
              ];
              const maybePrelease = semver.prerelease(version);
              const maybeSupported = supportedPreleases.find(
                (p) => p.tag === maybePrelease?.[0]
              );

              // If we have a prelease and it is in the supported range, then we can use it
              if (maybePrelease && maybeSupported) {
                version = `${parsed.major}.${parsed.minor}.${parsed.patch}-${
                  maybeSupported.number
                }${maybePrelease[1] ?? 0}`;
              }

              if(maybePrelease && !maybeSupported) {
                core.setFailed(`Unsupported prerelease: ${version}`)
              }
            }

            // Ensure package_version is always valid semver (required by yarn/Tauri).
            // For non-semver tags (e.g. "r1") fall back to 0.0.1.
            const packageVersion = parsed ? version : "0.0.1"
            core.info(`Version: ${packageVersion}`)
            core.setOutput("package_version", packageVersion)

      - name: Get Release
        uses: actions/github-script@v9
        id: get-release
        with:
          script: |
            const refName = `${process.env.GITHUB_REF_NAME}`

            const res = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            })
            const release = res.data.find((r) => r.tag_name === refName)
            if(!release) { core.setFailed("Unable to find release for this workflow") }

            core.setOutput("id", release.id)

  build-app:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            asset_arch: x64
            bundles: msi
          - host: macos-latest
            platform: macos
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            asset_arch: x64
            bundles: dmg
          - host: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            bundles: dmg
          - host: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            asset_arch: amd64
            bundles: appimage
    name: ${{ matrix.platform }}-${{ matrix.asset_arch }}
    runs-on: ${{ matrix.host }}
    env:
      GO111MODULE: on
      GOFLAGS: -mod=vendor

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync node version and setup cache
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: "./desktop/yarn.lock"

      - name: Apply Version
        run: yarn version --new-version ${{ needs.create-release.outputs.package_version }} --no-git-tag-version
        working-directory: "./desktop"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Go setup
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Build CLI
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          BIN_NAME="devpod-cli-${{ matrix.target }}"
          mkdir -p test desktop/src-tauri/bin

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v${{ needs.create-release.outputs.original_package_version }}" -o "test/$BIN_NAME"

          cp "test/$BIN_NAME" "desktop/src-tauri/bin/$BIN_NAME"

      - name: Build CLI
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          set GOOS=windows
          set GOARCH=${{ matrix.goarch }}
          set BIN_NAME=devpod-cli-${{ matrix.target }}.exe

          go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version=v${{ needs.create-release.outputs.original_package_version }}" -o "test\%BIN_NAME%"

          copy /Y "test\%BIN_NAME%" "desktop\src-tauri\bin\%BIN_NAME%"

      - name: Install frontend dependencies
        run: yarn install
        working-directory: "./desktop"

      - name: Build Desktop App
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: "./desktop"
          args: "--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}"
          uploadUpdaterJson: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs")

            const releaseId = "${{ needs.create-release.outputs.release_id }}"
            const version = "${{ needs.create-release.outputs.package_version }}"
            const platform = "${{ matrix.platform }}"
            const target = "${{ matrix.target }}"
            const assetArch = "${{ matrix.asset_arch }}"
            const cliArch = "${{ matrix.goarch }}"
            const cliPath = `desktop/src-tauri/bin/devpod-cli-${target}${platform === "windows" ? ".exe" : ""}`

            const assets = []
            if (platform === "windows") {
              const msiVersion = version.replace("-", ".")
              const msiName = `DevPod_${msiVersion}_x64_en-US.msi`
              assets.push({
                name: msiName,
                path: `desktop/src-tauri/target/${target}/release/bundle/msi/${msiName}`
              })
              assets.push({ name: "devpod-windows-amd64.exe", path: cliPath })
            } else if (platform === "macos") {
              const dmgName = `DevPod_${version}_${assetArch}.dmg`
              assets.push({
                name: `DevPod_macos_${assetArch}.dmg`,
                path: `desktop/src-tauri/target/${target}/release/bundle/dmg/${dmgName}`
              })
              assets.push({ name: `devpod-darwin-${cliArch}`, path: cliPath })
            } else {
              const appImageName = `DevPod_${version}_${assetArch}.AppImage`
              assets.push({
                name: "DevPod_linux_amd64.AppImage",
                path: `desktop/src-tauri/target/${target}/release/bundle/appimage/${appImageName}`
              })
              assets.push({ name: `devpod-linux-${cliArch}`, path: cliPath })
            }

            for (const asset of assets) {
              console.log("Uploading release asset:", asset.name)
              await github.rest.repos.uploadReleaseAsset({
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": fs.statSync(asset.path).size
                },
                name: asset.name,
                data: fs.readFileSync(asset.path),
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId
              })
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
