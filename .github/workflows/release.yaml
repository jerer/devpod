name: Publish release
on:
  push:
    tags:
      - '*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      package_version: ${{ steps.get-version.outputs.package_version }}
      original_package_version: ${{ steps.get-version.outputs.original_package_version }}
      release_id: ${{ steps.get-release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - run: npm install semver

      - name: Get Version
        uses: actions/github-script@v6
        id: get-version
        with:
          script: |
            const semver = require("semver")
            const refName = `${process.env.GITHUB_REF_NAME}`
            // Strip leading "v" if present, otherwise use the tag as-is
            let version = refName.startsWith("v") ? refName.slice(1) : refName

            core.info(`Original Version: ${version}`)
            core.setOutput("original_package_version", version)

            // Apply semver prerelease normalization only for semver-formatted tags
            const parsed = semver.parse(version);
            if (parsed) {
              const supportedPreleases = [
                { tag: "alpha", number: 1 },
                { tag: "beta", number: 2 },
                { tag: "rc", number: 3 },
              ];
              const maybePrelease = semver.prerelease(version);
              const maybeSupported = supportedPreleases.find(
                (p) => p.tag === maybePrelease?.[0]
              );

              // If we have a prelease and it is in the supported range, then we can use it
              if (maybePrelease && maybeSupported) {
                version = `${parsed.major}.${parsed.minor}.${parsed.patch}-${
                  maybeSupported.number
                }${maybePrelease[1] ?? 0}`;
              }

              if(maybePrelease && !maybeSupported) {
                core.setFailed(`Unsupported prerelease: ${version}`)
              }
            }

            // Ensure package_version is always valid semver (required by yarn/Tauri).
            // For non-semver tags (e.g. "r1") fall back to 0.0.1.
            const packageVersion = parsed ? version : "0.0.1"
            core.info(`Version: ${packageVersion}`)
            core.setOutput("package_version", packageVersion)

      - name: Get Release
        uses: actions/github-script@v6
        id: get-release
        with:
          script: |
            const refName = `${process.env.GITHUB_REF_NAME}`

            const res = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            })
            const release = res.data.find((r) => r.tag_name === refName)
            if(!release) { core.setFailed("Unable to find release for this workflow") }

            core.setOutput("id", release.id)

  build-app:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      GO111MODULE: on
      GOFLAGS: -mod=vendor

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Apply Version
        run: yarn version --new-version ${{ needs.create-release.outputs.package_version }} --no-git-tag-version
        working-directory: "./desktop"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Go setup
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.8

      - name: Build CLI
        shell: cmd
        run: |
          set GOOS=windows
          set GOARCH=amd64
          set BIN_NAME=devpod-cli-x86_64-pc-windows-msvc.exe

          go build -ldflags "-s -w -X github.com/loft-sh/devpod/pkg/version.version="v${{ needs.create-release.outputs.original_package_version }}" -X github.com/loft-sh/devpod/pkg/telemetry.telemetryPrivateKey=${{ secrets.DEVPOD_TELEMETRY_PRIVATE_KEY }}" -o "test\%BIN_NAME%"

          xcopy /F /Y "test\%BIN_NAME%" desktop\src-tauri\bin\*

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: "./desktop/yarn.lock"

      - name: Install frontend dependencies
        run: yarn install
        working-directory: "./desktop"

      - name: Disable updater (no signing keys required)
        shell: pwsh
        run: |
          '{"tauri":{"updater":{"active":false}}}' | Out-File -FilePath "desktop/src-tauri/tauri-ci.conf.json" -Encoding utf8

      - name: Build Desktop App
        uses: tauri-apps/tauri-action@v0.4.5
        with:
          projectPath: "./desktop"
          args: "--no-sign --target x86_64-pc-windows-msvc --config src-tauri/tauri-ci.conf.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require("fs")

            const version = "${{ needs.create-release.outputs.package_version }}".replace("-", ".")
            const msiName = `DevPod_${version}_x64_en-US.msi`
            const msiPath = `desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/${msiName}`
            const cliName = "devpod-windows-amd64.exe"
            const cliPath = "desktop/src-tauri/bin/devpod-cli-x86_64-pc-windows-msvc.exe"

            const releaseId = "${{ needs.create-release.outputs.release_id }}"

            for (const asset of [{ name: msiName, path: msiPath }, { name: cliName, path: cliPath }]) {
              console.log("Uploading release asset: ", asset.name)
              await github.rest.repos.uploadReleaseAsset({
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": fs.statSync(asset.path).size
                },
                name: asset.name,
                data: fs.readFileSync(asset.path),
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId
              })
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
